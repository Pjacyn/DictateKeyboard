name: Release APK

# Push a tag like v6.4.0 -> signed release APK attached to a GitHub release.
# Manual run (workflow_dispatch) builds + uploads the APK as an artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read pinned tool versions
        id: tools
        run: |
          echo "ndk=$(grep '^ndk ' gradle/tools.versions.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
          echo "cmake=$(grep '^cmake ' gradle/tools.versions.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
          echo "buildTools=$(grep '^buildTools ' gradle/tools.versions.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;${{ steps.tools.outputs.buildTools }}" \
            "ndk;${{ steps.tools.outputs.ndk }}" \
            "cmake;${{ steps.tools.outputs.cmake }}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx native libs
        run: tools/fetch-sherpa-onnx.sh

      - name: Cache Bergamot native lib
        id: bergamot-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libdictate_bergamot.so
          key: bergamot-${{ hashFiles('tools/bergamot/**', 'gradle/tools.versions.toml') }}

      - name: Build Bergamot (arm64)
        if: steps.bergamot-cache.outputs.cache-hit != 'true'
        run: tools/bergamot/build-android.sh

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing - refusing to ship an unsigned APK"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist
          test -n "$(ls dist/*.apk)"

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.apk \
            --title "${{ github.ref_name }}" --generate-notes
